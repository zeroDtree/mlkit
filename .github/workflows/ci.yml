name: CI

on:
  push:
    branches: [main, callback]
  pull_request:
    branches: [main, callback]

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Pytest
        run: uv run pytest